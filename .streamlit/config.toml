[server]
headless = true
enableCORS = false
enableXsrfProtection = false
# PCAP uploads are parsed in memory on a small cloud instance
maxUploadSize = 50

[theme]
base = 'dark'
primaryColor = '#3b82f6'
backgroundColor = '#0a0e1a'
secondaryBackgroundColor = '#0f172a'
textColor = '#f8fafc'
font = 'sans serif'
